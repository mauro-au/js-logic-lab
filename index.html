<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Logic Lab</title>
    <meta
      name="description"
      content="Laboratorio interactivo para practicar lógica de programación en JavaScript: 101 retos, tests automáticos y terminal simulada."
    />
    <meta name="theme-color" content="#0b111e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="JS Logic Lab" />
    <meta
      property="og:description"
      content="101 retos de lógica en JavaScript con tests automáticos, benchmark de soluciones y terminal simulada."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JS Logic Lab" />
    <meta
      name="twitter:description"
      content="101 retos de lógica en JavaScript con tests automáticos, benchmark de soluciones y terminal simulada."
    />
  </head>
  <body>
    <noscript>
      <p style="margin: 0 0 24px; padding: 16px 20px; border: 1px solid #1e293b; border-radius: 8px; background: #111827; color: #f3f4f6;">
        JS Logic Lab necesita JavaScript para ejecutar los ejercicios. Actívalo y recarga la página.
      </p>
    </noscript>

    <div id="app">
      <!-- Encabezado Superior -->
      <header class="main-header">
        <div class="brand">
          <div class="logo-container">
            <svg class="flask-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12" />
              <path d="M12 3v6" />
              <path d="M9 9h6" />
              <path d="M9 9L4.5 19.5A2 2 0 0 0 6.3 22h11.4a2 2 0 0 0 1.8-2.5L15 9" />
              <path d="M5.5 17h13" stroke-dasharray="2 2" class="liquid-line" />
            </svg>
          </div>
          <h1 class="gradient-title">JS Logic Lab <span class="version">V1.3</span></h1>
        </div>
        <div class="notifications" id="contador-progreso" aria-live="polite">
          <span class="dot-green">●</span> Cargando progreso...
        </div>
      </header>
      
      <!-- Panel de Control Reestructurado -->
      <div class="control-panel" role="search" aria-label="Buscar y filtrar ejercicios">
        <div class="control-labels">
          <label for="buscador-ejercicios">BUSCAR ALGORITMO</label>
          <label for="selector-categoria">FILTRAR POR ORIGEN</label>
          <label for="selector-dificultad">DIFICULTAD GLOBAL</label>
          <label for="selector-ejercicios">SELECCIONAR RETO DISPONIBLE</label>
        </div>
        
        <div class="actions-group">
          <!-- 🔍 Input de Búsqueda al inicio con Icono integrado por CSS -->
          <div class="search-wrapper">
            <input
              type="search"
              id="buscador-ejercicios"
              placeholder="Buscar algoritmo (fizz, loops...)"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <!-- Selector de Categorías / Orígenes -->
          <select id="selector-categoria">
            <option value="TODOS">⚡ Todas las fuentes</option>
          </select>

          <!-- Selector de Dificultad -->
          <select id="selector-dificultad">
            <option value="TODOS">● Dificultad: Todas</option>
            <option value="FÁCIL">🟢 Fácil</option>
            <option value="MEDIO">🟡 Medio</option>
            <option value="DIFÍCIL">🔴 Difícil</option>
          </select>

          <!-- Selector de Ejercicios Filtrados -->
          <select id="selector-ejercicios">
            <!-- Cargado dinámicamente -->
          </select>
        </div>
      </div>

      <!-- Resumen de progreso -->
      <section class="resumen-progreso" id="resumen-progreso" aria-label="Resumen de progreso">
        <div class="progreso-cabecera">
          <span class="progreso-titulo">● RESUMEN DE PROGRESO</span>
          <span class="progreso-total"><strong class="progreso-porcentaje">0%</strong> completado</span>
        </div>
        <div
          class="progreso-barra"
          role="progressbar"
          aria-label="Porcentaje de ejercicios completados"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progreso-relleno"></div>
        </div>
        <div class="progreso-chips"></div>
      </section>

      <!-- Contenedor Dinámico Principal -->
      <main id="resultado">
        <div class="placeholder-box">
          <p>Selecciona un ejercicio del panel superior para inicializar el entorno de pruebas.</p>
        </div>
      </main>

      <!-- Barra de Estado Inferior -->
      <footer class="status-bar">
        <span>Desafíos de lógica en JavaScript</span>
        <div class="status-right">
          <span class="atajos-status">Atajos: <strong>Ctrl/Cmd + Enter</strong> ejecutar · <strong>Ctrl/Cmd + K</strong> buscar</span>
          <span>Ejercicios: <strong id="total-ejercicios">0</strong></span>
          <span>Ambiente: <strong>Navegador</strong></span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
